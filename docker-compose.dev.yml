services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev:docker
    ports:
      - '3000:3000'
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/express_best
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - node_modules/
            - dist/
        - action: sync+restart
          path: ./tsconfig.json
          target: /app/tsconfig.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
    restart: unless-stopped

  mongo:
    image: mongo:latest
    ports:
      - '27017:27017'
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping').ok\" --quiet localhost:27017/test | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
